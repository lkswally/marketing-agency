[project]
name = "marketing-agency-os"
version = "0.1.0"
description = "Modular, agent-based marketing OS. Standalone, optionally bridgeable to ATLAS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lucas Rojo", email = "lksrojo86@gmail.com" }]

# Runtime dependencies intentionally empty in MKT-1A.
# Added per block as needed (pydantic in MKT-1B, etc.).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []  # Populated when core/ exists (MKT-1D)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: contract tests for envelope/gates/audit (must pass before each block)",
    "integration: tests that hit external systems (skipped by default)",
]
