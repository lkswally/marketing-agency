[project]
name = "marketing-agency-os"
version = "0.1.0"
description = "Modular, agent-based marketing OS. Standalone, optionally bridgeable to ATLAS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lucas Rojo", email = "lksrojo86@gmail.com" }]

# Runtime dependencies are added per block.
# MKT-1B: pydantic for domain models.
# MKT-2A: pyyaml for workflow spec YAML parsing.
dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
mkt = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# MKT-4B: optional Anthropic SDK for the `--backend claude` flag.
# The templated backend works without this extra. If the SDK is not
# installed AND the operator passes `--backend claude`, the pipeline
# warns and falls back to templated cleanly.
claude = [
    "anthropic>=0.40,<1.0",
]
# MKT-5B: optional Notion SDK for `mkt notion-sync --write --confirm`.
# The dry-run path works without this extra. If the SDK is not installed
# AND the operator passes --write --confirm, the executor falls back to
# dry-run with a clear warning.
notion = [
    "notion-client>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: contract tests for envelope/gates/audit (must pass before each block)",
    "integration: tests that hit external systems (skipped by default)",
]
